<!DOCTYPE html>
<html>

<head>
    <title>AquaBill - Users</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<header>
    <h1>👤 User Management</h1>
    <p>AquaBill Users</p>
</header>


<div class="container">

<table>

<thead>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
</tr>
</thead>


<tbody>

<tr>
    <td>1</td>
    <td>Loading...</td>
    <td>Loading...</td>
    <td>Loading...</td>
</tr>

</tbody>

</table>


</div>


<footer>
    <a href="index.html">⬅ Back Home</a>
</footer>

<script>

fetch("http://localhost:8080/users")

.then(response => response.json())

.then(users => {

    let table = document.querySelector("tbody");

    table.innerHTML = "";


    users.forEach(user => {

        let row = `

        <tr>

            <td>${user.id}</td>

            <td>${user.name}</td>

            <td>${user.email}</td>

            <td>${user.phone ?? "N/A"}</td>

        </tr>

        `;


        table.innerHTML += row;

    });


})

.catch(error => {

    console.log("Error:", error);

});

</script>

</body>

</html>
